# Builds xD Client (xd-client/: the glass launcher) for macOS on GitHub's Mac runners, for Apple Silicon.
# Each .app carries Horizon's official launcher (its newest signed release), which xD Client
# drives for installs, Microsoft sign-in, packs and playing. xD Client is signed ad hoc; the .dmg
# files are this run's artifacts (Actions tab → the run → Artifacts). Publishes no release.
name: xD Client DMG

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/xd-client-dmg.yml'
      - 'xd-client/**'

permissions:
  contents: read

jobs:
  dmg:
    name: xd-client ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xd-client
          shared-key: xd-client-${{ matrix.arch }}
      - name: The official Horizon launcher
        # Horizon's own signed release (horizon-rust/horizon, launcher@X.Y.Z): its Microsoft
        # sign-in is Horizon's registered app, which a fork's build doesn't have. The newest
        # release with a build for this Mac; an older one when the newest has none yet.
        run: |
          set -euo pipefail
          asset=horizon-launcher-macos-${{ matrix.arch }}.zip
          tags=$(git ls-remote --tags https://github.com/horizon-rust/horizon \
            | grep -o 'refs/tags/launcher@[0-9.]*$' | sed 's#refs/tags/##' | sort -rV | head -10)
          for tag in $tags; do
            url="https://github.com/horizon-rust/horizon/releases/download/$tag/$asset"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/horizon.zip" "$url"; then
              echo "Using $tag"
              break
            fi
            echo "$tag has no $asset"
          done
          [[ -s "$RUNNER_TEMP/horizon.zip" ]] || { echo "::error::no Horizon launcher release for ${{ matrix.arch }}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/horizon"
          ditto -x -k "$RUNNER_TEMP/horizon.zip" "$RUNNER_TEMP/horizon"
          bin="$RUNNER_TEMP/horizon/Horizon.app/Contents/MacOS/horizon-launcher"
          codesign --verify --verbose=2 "$bin"
          echo "HORIZON_LAUNCHER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Build xD Client
        working-directory: xd-client
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package xD Client.app and the .dmg
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' xd-client/Cargo.toml | head -1)
          bash xd-client/packaging/package.sh \
            xd-client/target/${{ matrix.target }}/release/xd-client \
            "$HORIZON_LAUNCHER_BIN" \
            "$version" out ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: xD-Client-macos-${{ matrix.arch }}
          path: out/*.dmg
          retention-days: 30
